<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML, CSS & JavaScript Quick Start</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8f9ff;
      --card-bg: #ffffff;
      --text: #0b1c30;
      --subtext: #434655;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--subtext);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .counter-display {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin: 1rem 0;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    button.secondary {
      background-color: #e2e8f0;
      color: var(--text);
    }

    button.secondary:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>HTML + CSS + JavaScript</h1>
    <p>This page demonstrates standard single-file HTML structure with embedded CSS styles and interactive JavaScript behavior.</p>
    
    <div className="counter-container">
      <div id="counter" class="counter-display">0</div>
    </div>

    <div class="btn-group">
      <button id="decrementBtn" class="secondary">Decrement</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <button id="incrementBtn">Increment</button>
    </div>
  </div>

  <script>
    // JavaScript Logic
    let count = 0;
    const counterDisplay = document.getElementById('counter');
    const incrementBtn = document.getElementById('incrementBtn');
    const decrementBtn = document.getElementById('decrementBtn');
    const resetBtn = document.getElementById('resetBtn');

    function updateDisplay() {
      counterDisplay.textContent = count;
    }

    incrementBtn.addEventListener('click', () => {
      count++;
      updateDisplay();
    });

    decrementBtn.addEventListener('click', () => {
      count--;
      updateDisplay();
    });

    resetBtn.addEventListener('click', () => {
      count = 0;
      updateDisplay();
    });
  </script>

</body>
</html>
